<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#7c3aed" stroke-width="1.6"/></marker>
<marker id="gen" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="16" markerHeight="16" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#fff" stroke="#0f172a" stroke-width="1.5"/></marker>
</defs>
<style>.sys{font-size:20px;font-weight:700;fill:#0f172a} .act{font-size:16px;font-weight:700;fill:#0f172a}
.uc{font-size:15px;fill:#1e1b4b} .uid{font-size:12px;font-weight:700;fill:#6366f1} .st{font-size:13px;font-style:italic;fill:#6d28d9}
.nt{font-size:14px;fill:#713f12}</style>
<rect width="1500" height="880" fill="#fff"/>
<text x="750.0" y="44" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#0f172a">Use case diagram: entrance ESP32, MQTT bridge and the Database API</text>
<rect x="330" y="80" width="900" height="780" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="780.0" y="110" text-anchor="middle" class="sys">MQTT integration and REST API</text><g stroke="#0f172a" stroke-width="2.5" fill="none"><circle cx="170" cy="222" r="14" fill="#fff"/><line x1="170" y1="236" x2="170" y2="274"/><line x1="146" y1="250" x2="194" y2="250"/><line x1="170" y1="274" x2="152" y2="304"/><line x1="170" y1="274" x2="188" y2="304"/></g><text x="170" y="330" text-anchor="middle" class="act">Entrance ESP32</text><g stroke="#0f172a" stroke-width="2.5" fill="none"><circle cx="170" cy="602" r="14" fill="#fff"/><line x1="170" y1="616" x2="170" y2="654"/><line x1="146" y1="630" x2="194" y2="630"/><line x1="170" y1="654" x2="152" y2="684"/><line x1="170" y1="654" x2="188" y2="684"/></g><text x="170" y="710" text-anchor="middle" class="act">MQTT Bridge</text><ellipse cx="580" cy="180" rx="140" ry="44" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/><text x="580" y="156" text-anchor="middle" class="uid">UC14</text><text x="580" y="178" text-anchor="middle" class="uc">Publish Scan and</text><text x="580" y="198" text-anchor="middle" class="uc">Room State (MQTT)</text><ellipse cx="580" cy="360" rx="140" ry="44" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/><text x="580" y="336" text-anchor="middle" class="uid">UC15</text><text x="580" y="358" text-anchor="middle" class="uc">Relay Messages</text><text x="580" y="378" text-anchor="middle" class="uc">to the Database</text><ellipse cx="580" cy="540" rx="140" ry="44" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/><text x="580" y="516" text-anchor="middle" class="uid">UC15a</text><text x="580" y="538" text-anchor="middle" class="uc">Report Controller</text><text x="580" y="558" text-anchor="middle" class="uc">Health</text><ellipse cx="580" cy="710" rx="140" ry="44" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/><text x="580" y="686" text-anchor="middle" class="uid">UC16</text><text x="580" y="708" text-anchor="middle" class="uc">Forward Lockdown</text><text x="580" y="728" text-anchor="middle" class="uc">Command</text><ellipse cx="1010" cy="480" rx="140" ry="44" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/><text x="1010" y="456" text-anchor="middle" class="uid"></text><text x="1010" y="478" text-anchor="middle" class="uc">Authenticate Device</text><text x="1010" y="498" text-anchor="middle" class="uc">(X-Device-Key)</text><ellipse cx="1010" cy="250" rx="140" ry="44" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/><text x="1010" y="226" text-anchor="middle" class="uid"></text><text x="1010" y="248" text-anchor="middle" class="uc">Store Event Once</text><text x="1010" y="268" text-anchor="middle" class="uc">(stable event_uuid)</text><line x1="202" y1="260" x2="461" y2="203" stroke="#334155" stroke-width="1.8"/><line x1="202" y1="640" x2="521" y2="400" stroke="#334155" stroke-width="1.8"/><line x1="202" y1="640" x2="469" y2="567" stroke="#334155" stroke-width="1.8"/><line x1="202" y1="640" x2="457" y2="689" stroke="#334155" stroke-width="1.8"/><line x1="689" y1="332" x2="901" y2="278" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="755.0" y="292.0" width="80" height="20" fill="#fff"/><text x="795.0" y="307.0" text-anchor="middle" class="st">«include»</text><line x1="685" y1="389" x2="905" y2="451" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="755.0" y="407.0" width="80" height="20" fill="#fff"/><text x="795.0" y="422.0" text-anchor="middle" class="st">«include»</text><line x1="708" y1="522" x2="882" y2="498" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="755.0" y="497.0" width="80" height="20" fill="#fff"/><text x="795.0" y="512.0" text-anchor="middle" class="st">«include»</text><line x1="580" y1="496" x2="580" y2="404" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="540.0" y="437.0" width="80" height="20" fill="#fff"/><text x="580.0" y="452.0" text-anchor="middle" class="st">«extend»</text><path d="M1060,640 h284 l16,16 v62 h-300 z" fill="#fefce8" stroke="#ca8a04"/><text x="1072" y="664" class="nt">The ESP32 never calls the API:</text><text x="1072" y="684" class="nt">it publishes to the broker and</text><text x="1072" y="704" class="nt">the bridge makes the requests</text></svg>