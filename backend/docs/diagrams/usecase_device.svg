<rect width="1500" height="880" fill="#fff"/>
<text x="750.0" y="44" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#0f172a">Use case diagram: ESP32 controller and the Database API</text>
<rect x="330" y="80" width="900" height="780" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="780.0" y="110" text-anchor="middle" class="sys">Database and REST API subsystem</text><g stroke="#0f172a" stroke-width="2.5" fill="none"><circle cx="170" cy="292" r="14" fill="#fff"/><line x1="170" y1="306" x2="170" y2="344"/><line x1="146" y1="320" x2="194" y2="320"/><line x1="170" y1="344" x2="152" y2="374"/><line x1="170" y1="344" x2="188" y2="374"/></g><text x="170" y="400" text-anchor="middle" class="act">ESP32 Controller</text><circle cx="170" cy="740" r="30" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><path d="M170,722 V740 H184" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="170" y="796" text-anchor="middle" class="act">Time</text><text x="170" y="816" text-anchor="middle" class="act">(heartbeat timer)</text><ellipse cx="580" cy="170" rx="140" ry="44" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/><text x="580" y="146" text-anchor="middle" class="uid">UC03</text><text x="580" y="168" text-anchor="middle" class="uc">Request Access</text><text x="580" y="188" text-anchor="middle" class="uc">Decision</text><ellipse cx="580" cy="300" rx="140" ry="44" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/><text x="580" y="276" text-anchor="middle" class="uid">UC05</text><text x="580" y="298" text-anchor="middle" class="uc">Report Room</text><text x="580" y="318" text-anchor="middle" class="uc">Status</text><ellipse cx="580" cy="430" rx="140" ry="44" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/><text x="580" y="406" text-anchor="middle" class="uid">UC14</text><text x="580" y="428" text-anchor="middle" class="uc">Upload Offline</text><text x="580" y="448" text-anchor="middle" class="uc">Records</text><ellipse cx="580" cy="740" rx="140" ry="44" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/><text x="580" y="726" text-anchor="middle" class="uid">UC15a</text><text x="580" y="748" text-anchor="middle" class="uc">Send Heartbeat</text><ellipse cx="580" cy="590" rx="140" ry="44" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/><text x="580" y="566" text-anchor="middle" class="uid">UC15</text><text x="580" y="588" text-anchor="middle" class="uc">Download</text><text x="580" y="608" text-anchor="middle" class="uc">Configuration</text><ellipse cx="1010" cy="480" rx="140" ry="44" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/><text x="1010" y="456" text-anchor="middle" class="uid"></text><text x="1010" y="478" text-anchor="middle" class="uc">Authenticate Device</text><text x="1010" y="498" text-anchor="middle" class="uc">(X-Device-Key)</text><ellipse cx="1010" cy="250" rx="140" ry="44" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/><text x="1010" y="226" text-anchor="middle" class="uid"></text><text x="1010" y="248" text-anchor="middle" class="uc">Store Event Once</text><text x="1010" y="268" text-anchor="middle" class="uc">(unique event_uuid)</text><line x1="202" y1="330" x2="492" y2="204" stroke="#334155" stroke-width="1.8"/><line x1="202" y1="330" x2="444" y2="310" stroke="#334155" stroke-width="1.8"/><line x1="202" y1="330" x2="469" y2="403" stroke="#334155" stroke-width="1.8"/><line x1="202" y1="330" x2="538" y2="698" stroke="#334155" stroke-width="1.8"/><line x1="202" y1="330" x2="518" y2="551" stroke="#334155" stroke-width="1.8"/><line x1="202" y1="740" x2="440" y2="740" stroke="#334155" stroke-width="1.8"/><line x1="700" y1="192" x2="890" y2="228" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="755.0" y="197.0" width="80" height="20" fill="#fff"/><text x="795.0" y="212.0" text-anchor="middle" class="st">«include»</text><line x1="711" y1="285" x2="879" y2="265" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="755.0" y="262.0" width="80" height="20" fill="#fff"/><text x="795.0" y="277.0" text-anchor="middle" class="st">«include»</text><line x1="664" y1="395" x2="926" y2="285" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="755.0" y="327.0" width="80" height="20" fill="#fff"/><text x="795.0" y="342.0" text-anchor="middle" class="st">«include»</text><line x1="636" y1="210" x2="954" y2="440" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="755.0" y="312.0" width="80" height="20" fill="#fff"/><text x="795.0" y="327.0" text-anchor="middle" class="st">«include»</text><line x1="664" y1="335" x2="926" y2="445" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="755.0" y="377.0" width="80" height="20" fill="#fff"/><text x="795.0" y="392.0" text-anchor="middle" class="st">«include»</text><line x1="711" y1="445" x2="879" y2="465" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="755.0" y="442.0" width="80" height="20" fill="#fff"/><text x="795.0" y="457.0" text-anchor="middle" class="st">«include»</text><line x1="645" y1="701" x2="945" y2="519" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="755.0" y="597.0" width="80" height="20" fill="#fff"/><text x="795.0" y="612.0" text-anchor="middle" class="st">«include»</text><line x1="689" y1="562" x2="901" y2="508" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="755.0" y="522.0" width="80" height="20" fill="#fff"/><text x="795.0" y="537.0" text-anchor="middle" class="st">«include»</text><line x1="580" y1="634" x2="580" y2="696" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="540.0" y="652.0" width="80" height="20" fill="#fff"/><text x="580.0" y="667.0" text-anchor="middle" class="st">«extend»</text><path d="M1060,640 h284 l16,16 v62 h-300 z" fill="#fefce8" stroke="#ca8a04"/><text x="1072" y="664" class="nt">«extend»: configuration is only</text><text x="1072" y="684" class="nt">downloaded when the heartbeat</text><text x="1072" y="704" class="nt">reply shows a new config_version</text></svg>