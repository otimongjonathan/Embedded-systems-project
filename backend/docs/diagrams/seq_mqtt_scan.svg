 height="56" rx="6" fill="#fefce8" stroke="#ca8a04"/><text x="577.1428571428571" y="248" text-anchor="middle" class="n">state_evaluate(): authorised? schedule?</text><text x="577.1428571428571" y="268" text-anchor="middle" class="n">already inside? (under the state mutex)</text><line x1="577.1428571428571" y1="330" x2="80.0" y2="330" stroke="#1e293b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="328.57142857142856" y="320" text-anchor="middle" class="m">door opens 3 s, green LED, beep, LCD</text><line x1="577.1428571428571" y1="380" x2="825.7142857142858" y2="380" stroke="#1e293b" stroke-width="2" marker-end="url(#a)"/><text x="701.4285714285714" y="370" text-anchor="middle" class="m">append access.csv (storage mutex)</text><line x1="577.1428571428571" y1="450" x2="1074.2857142857142" y2="450" stroke="#1e293b" stroke-width="2" marker-end="url(#a)"/><text x="825.7142857142857" y="420" text-anchor="middle" class="m">publish cocis/event/access</text><text x="825.7142857142857" y="440" text-anchor="middle" class="m">{tag, dir: IN, result: OK, ts}</text><line x1="577.1428571428571" y1="500" x2="1074.2857142857142" y2="500" stroke="#1e293b" stroke-width="2" marker-end="url(#a)"/><text x="825.7142857142857" y="490" text-anchor="middle" class="m">publish cocis/state/occupancy {count} (retained)</text><line x1="1074.2857142857142" y1="550" x2="1322.857142857143" y2="550" stroke="#1e293b" stroke-width="2" marker-end="url(#a)"/><text x="1198.5714285714284" y="540" text-anchor="middle" class="m">deliver to subscriber</text><rect x="1132.857142857143" y="578" width="380" height="56" rx="6" fill="#fefce8" stroke="#ca8a04"/><text x="1322.857142857143" y="598" text-anchor="middle" class="n">convert: OK to GRANTED / OK</text><text x="1322.857142857143" y="618" text-anchor="middle" class="n">event_uuid MQ-11223344-IN-&lt;ts&gt;</text><line x1="1322.857142857143" y1="700" x2="1571.4285714285716" y2="700" stroke="#1e293b" stroke-width="2" marker-end="url(#a)"/><text x="1447.1428571428573" y="670" text-anchor="middle" class="m">POST /device/relay</text><text x="1447.1428571428573" y="690" text-anchor="middle" class="m">(X-Device-Key)</text><line x1="1571.4285714285716" y1="770" x2="1820.0" y2="770" stroke="#1e293b" stroke-width="2" marker-end="url(#a)"/><text x="1695.7142857142858" y="740" text-anchor="middle" class="m">INSERT access_events</text><text x="1695.7142857142858" y="760" text-anchor="middle" class="m">+ visit, COMMIT</text><line x1="1571.4285714285716" y1="820" x2="1322.857142857143" y2="820" stroke="#1e293b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="1447.1428571428573" y="810" text-anchor="middle" class="m">200 {accepted: [uuid]}</text><rect x="1381.4285714285716" y="848" width="380" height="56" rx="6" fill="#fefce8" stroke="#ca8a04"/><text x="1571.4285714285716" y="868" text-anchor="middle" class="n">dashboard refreshes every 3 s:</text><text x="1571.4285714285716" y="888" text-anchor="middle" class="n">the person appears under People inside</text></svg>