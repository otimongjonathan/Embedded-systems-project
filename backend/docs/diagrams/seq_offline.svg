"2" marker-end="url(#a)"/><text x="247.5" y="140" text-anchor="middle" class="m">taps tag at EXIT lane</text><line x1="415.0" y1="200" x2="750.0" y2="200" stroke="#1e293b" stroke-width="2" marker-end="url(#x)"/><text x="582.5" y="190" text-anchor="middle" class="m">POST /device/access/check</text><rect x="225.0" y="228" width="380" height="76" rx="6" fill="#fefce8" stroke="#ca8a04"/><text x="415.0" y="248" text-anchor="middle" class="n">no reply within 3 s, so OFFLINE mode</text><text x="415.0" y="268" text-anchor="middle" class="n">decide() using cached users.csv,</text><text x="415.0" y="288" text-anchor="middle" class="n">schedule.csv and people-inside list</text><line x1="415.0" y1="370" x2="750.0" y2="370" stroke="#1e293b" stroke-width="2" marker-end="url(#a)"/><text x="582.5" y="340" text-anchor="middle" class="m">append access_log.csv</text><text x="582.5" y="360" text-anchor="middle" class="m">append outbox.csv (decision, reason, uuid)</text><line x1="415.0" y1="420" x2="80.0" y2="420" stroke="#1e293b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="247.5" y="410" text-anchor="middle" class="m">door opens (or buzzer if DENIED)</text><line x1="30" y1="470" x2="1470" y2="470" stroke="#94a3b8" stroke-dasharray="10 6"/><rect x="550.0" y="454" width="400" height="32" rx="16" fill="#e2e8f0"/><text x="750.0" y="476" text-anchor="middle" class="d">Wi-Fi connection restored</text><line x1="415.0" y1="530" x2="1085.0" y2="530" stroke="#1e293b" stroke-width="2" marker-end="url(#a)"/><text x="750.0" y="520" text-anchor="middle" class="m">POST /device/heartbeat {pending_events: 12}</text><line x1="1085.0" y1="580" x2="415.0" y2="580" stroke="#1e293b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="750.0" y="570" text-anchor="middle" class="m">{config_version: 9, emergency_mode: false}</text><line x1="750.0" y1="630" x2="415.0" y2="630" stroke="#1e293b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="582.5" y="620" text-anchor="middle" class="m">read up to 200 records from outbox.csv</text><line x1="415.0" y1="700" x2="1085.0" y2="700" stroke="#1e293b" stroke-width="2" marker-end="url(#a)"/><text x="750.0" y="670" text-anchor="middle" class="m">POST /device/events/batch</text><text x="750.0" y="690" text-anchor="middle" class="m">{access_events: [...], room_events: [...]}</text><line x1="1085.0" y1="770" x2="1420.0" y2="770" stroke="#1e293b" stroke-width="2" marker-end="url(#a)"/><text x="1252.5" y="740" text-anchor="middle" class="m">ONE transaction, sorted by time</text><text x="1252.5" y="760" text-anchor="middle" class="m">skip uuids already stored, update visits</text><line x1="1085.0" y1="820" x2="415.0" y2="820" stroke="#1e293b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="750.0" y="810" text-anchor="middle" class="m">{accepted: [...], duplicates: [...]}</text><line x1="415.0" y1="870" x2="750.0" y2="870" stroke="#1e293b" stroke-width="2" marker-end="url(#a)"/><text x="582.5" y="860" text-anchor="middle" class="m">delete those uuids from outbox.csv</text><rect x="225.0" y="898" width="380" height="36" rx="6" fill="#fefce8" stroke="#ca8a04"/><text x="415.0" y="918" text-anchor="middle" class="n">config_version 9 differs from cached 8</text><line x1="415.0" y1="980" x2="1085.0" y2="980" stroke="#1e293b" stroke-width="2" marker-end="url(#a)"/><text x="750.0" y="970" text-anchor="middle" class="m">GET /device/config</text><line x1="1085.0" y1="1030" x2="415.0" y2="1030" stroke="#1e293b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="750.0" y="1020" text-anchor="middle" class="m">schedule, authorised_tags, light modes</text><line x1="415.0" y1="1080" x2="750.0" y2="1080" stroke="#1e293b" stroke-width="2" marker-end="url(#a)"/><text x="582.5" y="1070" text-anchor="middle" class="m">overwrite users.csv, schedule.csv</text></svg>