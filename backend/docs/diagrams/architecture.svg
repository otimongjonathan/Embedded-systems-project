<text x="1460" y="225" text-anchor="middle" class="l" fill="#7c3aed">MQTT</text>
<path d="M1650,267 L1650,370" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#a)"/>
<text x="1685" y="315" text-anchor="middle" class="l" fill="#7c3aed">HTTP</text>
<path d="M1650,498 L1650,590" stroke="#a21caf" stroke-width="3" fill="none" marker-end="url(#a)"/>
<text x="1680" y="550" text-anchor="middle" class="l" fill="#a21caf">SQL</text>
<path d="M1890,800 L1890,498" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#a)"/>
<text x="1925" y="650" text-anchor="middle" class="l" fill="#7c3aed">HTTP</text>
<text x="1925" y="668" text-anchor="middle" class="l" fill="#7c3aed">token</text>
