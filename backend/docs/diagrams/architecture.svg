<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .t{font-size:24px;font-weight:700;fill:#0f172a}
      .h{font-size:20px;font-weight:700;fill:#0f172a}
      .b{font-size:18px;fill:#1e293b}
      .s{font-size:16px;fill:#475569}
      .dev{fill:#fff;stroke:#94a3b8;stroke-width:1.5}
      .ln{stroke:#334155;stroke-width:2;fill:none}
      .th{font-size:16px;font-weight:700;fill:#fff}
      .td{font-size:16px;fill:#0f172a}
    </style>
  </defs>
  <rect width="1800" height="1000" fill="#ffffff"/>
  <text x="900" y="46" text-anchor="middle" style="font-size:28px;font-weight:700;fill:#0f172a">CoCIS Smart Control and Monitoring System: Architecture</text>

  <!-- ================= LAYER 1: FIELD DEVICES ================= -->
  <rect x="30" y="80" width="500" height="890" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="280" y="116" text-anchor="middle" class="t">1. Field Devices</text>

  <rect x="50" y="136" width="460" height="230" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="168" class="h" fill="#1d4ed8">Main Entrance</text>
  <rect class="dev" rx="8" x="70" y="186" width="200" height="70"/><text x="170" y="216" text-anchor="middle" class="b">RFID reader</text><text x="170" y="240" text-anchor="middle" class="s">entry lane</text>
  <rect class="dev" rx="8" x="290" y="186" width="200" height="70"/><text x="390" y="216" text-anchor="middle" class="b">RFID reader</text><text x="390" y="240" text-anchor="middle" class="s">exit lane</text>
  <rect class="dev" rx="8" x="70" y="272" width="200" height="70"/><text x="170" y="302" text-anchor="middle" class="b">Door servos</text><text x="170" y="326" text-anchor="middle" class="s">entry, exit</text>
  <rect class="dev" rx="8" x="290" y="272" width="200" height="70"/><text x="390" y="302" text-anchor="middle" class="b">LCD, LEDs</text><text x="390" y="326" text-anchor="middle" class="s">and buzzer</text>

  <rect x="50" y="386" width="460" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="70" y="418" class="h" fill="#15803d">Lecture Room 1</text>
  <rect class="dev" rx="8" x="70" y="436" width="200" height="70"/><text x="170" y="466" text-anchor="middle" class="b">IR beam pair</text><text x="170" y="490" text-anchor="middle" class="s">at the door</text>
  <rect class="dev" rx="8" x="290" y="436" width="200" height="70"/><text x="390" y="478" text-anchor="middle" class="b">Lights</text>

  <rect x="50" y="546" width="460" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="70" y="578" class="h" fill="#15803d">Lecture Room 2</text>
  <rect class="dev" rx="8" x="70" y="596" width="200" height="70"/><text x="170" y="626" text-anchor="middle" class="b">IR beam pair</text><text x="170" y="650" text-anchor="middle" class="s">at the door</text>
  <rect class="dev" rx="8" x="290" y="596" width="200" height="70"/><text x="390" y="638" text-anchor="middle" class="b">Lights</text>

  <rect x="50" y="706" width="460" height="244" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="70" y="738" class="h" fill="#b45309">Storage and Console</text>
  <rect class="dev" rx="8" x="70" y="756" width="420" height="80"/><text x="280" y="790" text-anchor="middle" class="b">microSD card</text><text x="280" y="816" text-anchor="middle" class="s">CSV logs, config copy, upload queue</text>
  <rect class="dev" rx="8" x="70" y="852" width="420" height="80"/><text x="280" y="886" text-anchor="middle" class="b">Serial monitor</text><text x="280" y="912" text-anchor="middle" class="s">management menu</text>

  <!-- ================= LAYER 2: ESP32 ================= -->
  <rect x="610" y="80" width="560" height="890" rx="16" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
  <text x="890" y="116" text-anchor="middle" class="t">2. ESP32 Controller</text>
  <text x="890" y="142" text-anchor="middle" class="s">one board, ESP-IDF and FreeRTOS</text>

  <rect x="635" y="160" width="510" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="655" y="190" class="h">Access Control Task</text><text x="655" y="212" class="s">checks tags, opens doors</text>
  <rect x="635" y="236" width="510" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="655" y="266" class="h">Lighting Control Task</text><text x="655" y="288" class="s">counts people, switches lights</text>
  <rect x="635" y="312" width="510" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="655" y="342" class="h">Serial Menu Task</text><text x="655" y="364" class="s">status and settings for staff</text>
  <rect x="635" y="388" width="510" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="655" y="418" class="h">Network and Sync Task</text><text x="655" y="440" class="s">Wi-Fi, clock, uploads, config</text>

  <rect x="635" y="468" width="510" height="76" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="890" y="498" text-anchor="middle" class="h">Shared resources</text>
  <text x="890" y="526" text-anchor="middle" class="s">state_mutex, sd_mutex, event_queue</text>

  <!-- decision rules table -->
  <text x="890" y="584" text-anchor="middle" class="h">Access decision rules</text>
  <g transform="translate(635,600)">
    <rect width="510" height="40" fill="#1f3864"/>
    <text x="22" y="26" class="th">#</text><text x="60" y="26" class="th">Condition</text><text x="420" y="26" class="th">Result</text>
    <rect y="40" width="510" height="40" fill="#fff"/><text x="22" y="66" class="td">1</text><text x="60" y="66" class="td">Emergency mode on</text><text x="420" y="66" class="td" font-weight="700">Open</text>
    <rect y="80" width="510" height="40" fill="#eef2f8"/><text x="22" y="106" class="td">2</text><text x="60" y="106" class="td">Unknown tag</text><text x="420" y="106" class="td">Deny</text>
    <rect y="120" width="510" height="40" fill="#fff"/><text x="22" y="146" class="td">3</text><text x="60" y="146" class="td">Deactivated user</text><text x="420" y="146" class="td">Deny</text>
    <rect y="160" width="510" height="40" fill="#eef2f8"/><text x="22" y="186" class="td">4</text><text x="60" y="186" class="td">Outside schedule (entry or exit)</text><text x="420" y="186" class="td">Deny</text>
    <rect y="200" width="510" height="40" fill="#fff"/><text x="22" y="226" class="td">5</text><text x="60" y="226" class="td">Already inside, or not inside</text><text x="420" y="226" class="td">Deny</text>
    <rect y="240" width="510" height="40" fill="#eef2f8"/><text x="22" y="266" class="td">6</text><text x="60" y="266" class="td">Otherwise</text><text x="420" y="266" class="td" font-weight="700">Open</text>
    <rect width="510" height="280" fill="none" stroke="#94a3b8"/>
    <line x1="44" y1="0" x2="44" y2="280" stroke="#94a3b8"/><line x1="404" y1="0" x2="404" y2="280" stroke="#94a3b8"/>
  </g>

  <!-- ================= LAYER 3: SERVER ================= -->
  <rect x="1250" y="80" width="520" height="890" rx="16" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1510" y="116" text-anchor="middle" class="t">3. Server</text>

  <rect x="1275" y="150" width="470" height="110" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1510" y="190" text-anchor="middle" class="h">Management clients</text>
  <text x="1510" y="218" text-anchor="middle" class="s">Swagger UI, Postman, dashboard</text>
  <text x="1510" y="242" text-anchor="middle" class="s">roles: admin, security, viewer</text>

  <rect x="1275" y="330" width="470" height="250" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1510" y="368" text-anchor="middle" class="h">REST API (FastAPI)</text>
  <rect x="1295" y="390" width="205" height="110" rx="8" fill="#ede9fe"/>
  <text x="1397" y="436" text-anchor="middle" class="b" font-weight="700">Device</text>
  <text x="1397" y="462" text-anchor="middle" class="s">device key</text>
  <rect x="1520" y="390" width="205" height="110" rx="8" fill="#ede9fe"/>
  <text x="1622" y="436" text-anchor="middle" class="b" font-weight="700">Management</text>
  <text x="1622" y="462" text-anchor="middle" class="s">login token</text>
  <text x="1510" y="546" text-anchor="middle" class="s">rules, validation, audit log</text>

  <g transform="translate(1290,660)">
    <path d="M0,30 L0,220 A220,30 0 0 0 440,220 L440,30" fill="#fdf4ff" stroke="#a21caf" stroke-width="2"/>
    <ellipse cx="220" cy="30" rx="220" ry="30" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
    <text x="220" y="38" text-anchor="middle" class="h">SQLite database</text>
    <text x="220" y="110" text-anchor="middle" class="b">11 tables</text>
    <text x="220" y="140" text-anchor="middle" class="s">users, visits, access events,</text>
    <text x="220" y="164" text-anchor="middle" class="s">rooms, schedule, settings</text>
  </g>

  <!-- ================= CONNECTIONS ================= -->
  <path class="ln" d="M510,300 H555 V192 H629" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M510,471 H570 V268 H629" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M510,631 H570 V471"/>
  <path class="ln" d="M510,892 H585 V344 H629" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M510,796 H600 V506 H629" marker-end="url(#a)" marker-start="url(#a)"/>

  <path class="ln" d="M1145,420 H1269" stroke="#7c3aed" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="1207" y="406" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#6d28d9">Wi-Fi</text>
  <text x="1207" y="448" text-anchor="middle" style="font-size:15px;fill:#6d28d9">HTTP, JSON</text>

  <path class="ln" d="M1510,260 V324" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M1510,580 V654" stroke="#a21caf" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
</svg>
